name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TP-s-Anchor-Optimizer
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          build-root-directory: TP-s-Anchor-Optimizer

      - name: build
        run: gradle build --no-daemon

      - name: upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: TPs-Anchor-Optimiser
          path: |
            TP-s-Anchor-Optimizer/build/libs/*.jar
            !TP-s-Anchor-Optimizer/build/libs/*-sources.jar
